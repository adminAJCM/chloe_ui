<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chloe — Supplier Bill Cockpit</title>
<style>
  :root{
    --plane:#0d0d0d; --surface-1:#1a1a19; --surface-2:#222220; --surface-3:#2a2a27;
    --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --border:rgba(255,255,255,0.10); --border-2:rgba(255,255,255,0.06);
    --accent:#3987e5; --accent-soft:rgba(57,135,229,0.14);
    --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --critical:#d03b3b;
    --good-soft:rgba(12,163,12,0.14); --warn-soft:rgba(250,178,25,0.14);
    --serious-soft:rgba(236,131,90,0.14); --critical-soft:rgba(208,59,59,0.16);
    --radius:10px; --radius-sm:7px;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    --font:system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--plane);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer;color:inherit}
  .tnum{font-variant-numeric:tabular-nums}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#3a3a37;border-radius:6px;border:2px solid var(--plane)}

  /* ---------- shell ---------- */
  .app{display:grid;grid-template-columns:220px 1fr;height:100vh}
  .rail{background:var(--surface-1);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:14px 12px;gap:6px}
  .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px}
  .brand .mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#7b3ae0);display:grid;place-items:center;font-weight:800;color:#fff}
  .brand h1{font-size:15px;margin:0;font-weight:700;letter-spacing:.2px}
  .brand small{display:block;color:var(--muted);font-size:11px;font-weight:500}
  .navitem{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--radius-sm);color:var(--ink-2);border:1px solid transparent;font-weight:500;font-size:13.5px}
  .navitem:hover{background:var(--surface-2);color:var(--ink)}
  .navitem.active{background:var(--accent-soft);color:#fff;border-color:rgba(57,135,229,.35)}
  .navitem .ic{width:18px;text-align:center;opacity:.9}
  .navitem .badge{margin-left:auto;background:var(--surface-3);color:var(--ink-2);border-radius:20px;font-size:11px;padding:1px 7px;font-weight:600}
  .navitem.active .badge{background:var(--accent);color:#fff}
  .rail .spacer{flex:1}
  .rail-foot{border-top:1px solid var(--border);padding-top:10px;font-size:11px;color:var(--muted)}

  .main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
  .topbar{height:52px;flex:0 0 52px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 18px;background:var(--surface-1)}
  .topbar .title{font-weight:600;font-size:14.5px}
  .topbar .grow{flex:1}
  .chip{display:inline-flex;align-items:center;gap:7px;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600;border:1px solid var(--border)}
  .chip .dot{width:7px;height:7px;border-radius:50%}
  .mode-select{background:var(--surface-2);border:1px solid var(--border);color:var(--ink);border-radius:8px;padding:6px 10px;font-size:12.5px;font-weight:600}
  .toggle{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
  .toggle button{background:transparent;border:0;padding:6px 12px;font-size:12px;font-weight:600;color:var(--muted)}
  .toggle button.on{background:var(--accent);color:#fff}
  .content{flex:1;overflow:auto;padding:20px 22px}

  /* ---------- generic ---------- */
  .card{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--radius)}
  .muted{color:var(--muted)}
  .sec2{color:var(--ink-2)}
  h2.page{margin:0 0 2px;font-size:18px}
  .sub{color:var(--muted);font-size:12.5px;margin-bottom:16px}
  .btn{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:9px 14px;font-weight:600;font-size:13px;color:var(--ink)}
  .btn:hover{background:var(--surface-3)}
  .btn.primary{background:var(--accent);border-color:transparent;color:#fff}
  .btn.primary:hover{filter:brightness(1.08)}
  .btn.good{background:var(--good);border-color:transparent;color:#fff}
  .btn.ghost{background:transparent}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .row{display:flex;gap:10px;align-items:center}

  /* confidence + status pills — color ALWAYS with icon+label */
  .pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:6px;font-size:11.5px;font-weight:700;border:1px solid transparent;white-space:nowrap}
  .pill .g{font-size:11px}
  .pill.good{color:#7ee07e;background:var(--good-soft);border-color:rgba(12,163,12,.35)}
  .pill.warn{color:#ffd274;background:var(--warn-soft);border-color:rgba(250,178,25,.35)}
  .pill.serious{color:#f4a982;background:var(--serious-soft);border-color:rgba(236,131,90,.35)}
  .pill.critical{color:#f19393;background:var(--critical-soft);border-color:rgba(208,59,59,.4)}
  .pill.neutral{color:var(--ink-2);background:var(--surface-2);border-color:var(--border)}
  .pill.accent{color:#9cc6f5;background:var(--accent-soft);border-color:rgba(57,135,229,.35)}

  /* ---------- review two-pane ---------- */
  .review-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;height:100%}
  @media(max-width:1200px){.review-grid{grid-template-columns:1fr}}
  .pane{display:flex;flex-direction:column;min-height:0}
  .pane-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border)}
  .pane-head .t{font-weight:600}
  .pane-body{overflow:auto;padding:14px}

  /* mock document */
  .doc{background:#fbfbf7;color:#1a1a1a;border-radius:8px;padding:26px 28px;font-size:12.5px;box-shadow:var(--shadow);position:relative}
  .doc h3{margin:0 0 2px;font-size:17px;color:#111}
  .doc .docmeta{color:#555;font-size:11.5px}
  .doc table{width:100%;border-collapse:collapse;margin-top:14px;font-size:11.5px}
  .doc th{text-align:left;border-bottom:1.5px solid #333;padding:5px 4px;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:#444}
  .doc td{padding:5px 4px;border-bottom:1px solid #e6e4dc}
  .doc .r{text-align:right}
  .fld{border-radius:4px;padding:0 2px;transition:background .15s,box-shadow .15s;cursor:pointer}
  .fld:hover{background:#fff3cf}
  .fld.hot{background:#ffe58a;box-shadow:0 0 0 2px #f0b400}
  .doc .totrow td{border:0;padding:2px 4px}
  .doc .grand{font-weight:800;font-size:13.5px}
  .doc .stamp{position:absolute;top:20px;right:22px;border:2px solid #c0392b;color:#c0392b;font-weight:800;font-size:11px;padding:3px 8px;border-radius:6px;transform:rotate(-8deg);opacity:.85}

  /* review fields */
  .kv{display:grid;grid-template-columns:120px 1fr auto;gap:8px 12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border-2)}
  .kv:last-child{border-bottom:0}
  .kv .k{color:var(--muted);font-size:12px}
  .kv .v{font-weight:600}
  .kv.hot{background:var(--accent-soft);margin:0 -8px;padding:8px;border-radius:6px}

  .block{border:1px solid var(--border);border-radius:9px;margin-bottom:14px;overflow:hidden}
  .block>.h{padding:10px 12px;background:var(--surface-2);display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;border-bottom:1px solid var(--border)}
  .block>.b{padding:12px}
  .block.alertband>.h{background:var(--critical-soft)}
  .block.warnband>.h{background:var(--warn-soft)}

  /* question card */
  .qcard{border:1px solid rgba(57,135,229,.4);background:linear-gradient(180deg,var(--accent-soft),transparent);border-radius:11px;padding:16px;margin-bottom:16px}
  .qcard .qlabel{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:#9cc6f5}
  .qcard .qtext{font-size:15.5px;font-weight:600;margin:6px 0 4px}
  .qcard .why{font-size:12px;color:var(--ink-2);margin-bottom:12px}

  /* Chloe persona */
  .chloe-av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#7b3ae0);display:grid;place-items:center;font-weight:800;color:#fff;font-size:14px;flex:0 0 auto;box-shadow:0 0 0 3px rgba(57,135,229,.18)}
  .chloe-av.sm{width:24px;height:24px;font-size:12px}
  .chloe-say{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
  .chloe-say .bub{background:var(--surface-2);border:1px solid var(--border);border-radius:4px 12px 12px 12px;padding:9px 12px;font-size:13.5px;color:var(--ink)}
  .chloe-say .bub b{color:#9cc6f5}
  .chloe-name{font-size:11px;color:var(--muted);font-weight:600;margin-bottom:3px}
  .thinking{display:inline-flex;gap:3px;align-items:center}
  .thinking i{width:5px;height:5px;border-radius:50%;background:var(--accent);display:inline-block;animation:blink 1.2s infinite}
  .thinking i:nth-child(2){animation-delay:.2s}.thinking i:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,60%,100%{opacity:.3}30%{opacity:1}}

  .cand{display:flex;align-items:center;gap:12px;padding:11px 12px;border:1px solid var(--border);border-radius:9px;margin-bottom:8px;background:var(--surface-1)}
  .cand:hover{border-color:var(--accent);background:var(--surface-2)}
  .cand .cn{font-weight:600}
  .cand .cm{font-size:11.5px;color:var(--muted)}
  .cand .grow{flex:1}
  .cand.selected{border-color:var(--good);background:var(--good-soft)}

  .line{display:grid;grid-template-columns:64px 1fr 54px 78px;gap:10px;padding:9px 4px;border-bottom:1px solid var(--border-2);align-items:center;font-size:12.5px}
  .line .sku{color:var(--muted);font-variant-numeric:tabular-nums}
  .line .desc{font-weight:500}
  .line .linkline{grid-column:2/-1;font-size:11.5px;color:#7ee0b8;margin-top:2px}

  /* progress */
  .proc{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:18px;text-align:center;padding:40px}
  .spin{width:46px;height:46px;border-radius:50%;border:4px solid var(--surface-3);border-top-color:var(--accent);animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .steps{display:flex;flex-direction:column;gap:9px;font-size:13px;min-width:280px;text-align:left}
  .steps .s{display:flex;align-items:center;gap:10px;color:var(--muted)}
  .steps .s.done{color:var(--ink)}
  .steps .s.active{color:var(--accent);font-weight:600}
  .tick{width:18px;height:18px;border-radius:50%;border:2px solid var(--surface-3);display:grid;place-items:center;font-size:10px}
  .s.done .tick{background:var(--good);border-color:var(--good);color:#fff}
  .s.active .tick{border-color:var(--accent)}

  /* dropzone */
  .drop{border:2px dashed var(--border);border-radius:14px;padding:48px;text-align:center;background:var(--surface-1);max-width:560px;margin:6vh auto 0}
  .drop:hover{border-color:var(--accent);background:var(--surface-2)}
  .drop .big{font-size:34px}
  .samplebar{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}

  /* tables (queue/alerts) */
  .tbl{width:100%;border-collapse:collapse}
  .tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:600;padding:9px 12px;border-bottom:1px solid var(--border)}
  .tbl td{padding:11px 12px;border-bottom:1px solid var(--border-2);font-size:13px}
  .tbl tr:hover td{background:var(--surface-2)}
  .tbl tr{cursor:pointer}
  .grouphdr td{background:var(--surface-2);font-weight:700;font-size:11.5px;letter-spacing:.4px;text-transform:uppercase;color:var(--ink-2);cursor:default}
  .filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .fbtn{background:var(--surface-1);border:1px solid var(--border);border-radius:20px;padding:6px 13px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
  .fbtn.on{background:var(--accent);border-color:transparent;color:#fff}
  .age{font-variant-numeric:tabular-nums;font-weight:600}

  /* drawer */
  .drawer-wrap{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:40}
  .drawer-wrap.open{display:block}
  .drawer{position:absolute;top:0;right:0;height:100%;width:min(560px,92vw);background:var(--surface-1);border-left:1px solid var(--border);box-shadow:-20px 0 50px rgba(0,0,0,.5);display:flex;flex-direction:column;animation:slide .18s ease}
  @keyframes slide{from{transform:translateX(30px);opacity:.4}to{transform:none;opacity:1}}
  .drawer .dh{padding:16px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
  .drawer .db{padding:18px;overflow:auto;flex:1}
  .drawer .df{padding:14px 18px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end}
  .close{margin-left:auto;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;width:30px;height:30px;font-size:15px}

  .evi{font-size:12px;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--border);border-radius:7px;padding:8px 10px;margin-top:6px}
  .evi code{color:#9cc6f5}
  .banner{border-radius:9px;padding:11px 14px;font-size:13px;margin-bottom:14px;display:flex;gap:10px;align-items:flex-start}
  .banner.info{background:var(--accent-soft);border:1px solid rgba(57,135,229,.35)}
  .banner.err{background:var(--critical-soft);border:1px solid rgba(208,59,59,.4)}
  .banner.ok{background:var(--good-soft);border:1px solid rgba(12,163,12,.35)}

  .stat{display:flex;gap:14px;margin-bottom:16px;flex-wrap:wrap}
  .stat .t{background:var(--surface-1);border:1px solid var(--border);border-radius:10px;padding:12px 16px;min-width:140px}
  .stat .t .n{font-size:24px;font-weight:700}
  .stat .t .l{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}

  label.field{display:block;margin-bottom:12px;font-size:12.5px;color:var(--ink-2)}
  label.field input{width:100%;margin-top:5px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:9px 11px;color:var(--ink);font-size:13px;font-family:inherit}
  .hintbox{font-size:12px;color:var(--muted);background:var(--surface-2);border:1px dashed var(--border);border-radius:8px;padding:10px 12px;margin-top:10px}

  /* keyboard */
  kbd{font-family:var(--font);font-size:11px;font-weight:700;background:var(--surface-3);border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--ink-2);min-width:18px;display:inline-block;text-align:center}
  .kbdbar{display:flex;gap:14px;flex-wrap:wrap;align-items:center;padding:8px 14px;border-top:1px solid var(--border);background:var(--surface-1);font-size:11.5px;color:var(--muted)}
  .kbdbar span{display:inline-flex;gap:5px;align-items:center}
  .cand.kfocus,.qcard.kfocus{outline:2px solid var(--accent);outline-offset:2px}
  .cand.kfocus{border-color:var(--accent);background:var(--surface-2)}
  /* selection / bulk */
  .chk{width:16px;height:16px;border:1.5px solid var(--muted);border-radius:4px;display:inline-grid;place-items:center;cursor:pointer;flex:0 0 auto}
  .chk.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .bulkbar{display:flex;align-items:center;gap:12px;background:var(--accent-soft);border:1px solid rgba(57,135,229,.4);border-radius:10px;padding:10px 14px;margin-bottom:12px}
  .bulkbar .grow{flex:1}
  td.selcol,th.selcol{width:34px;text-align:center;padding-left:14px}
  tr.selected td{background:var(--accent-soft) !important}

  /* ---------- responsive / mobile ---------- */
  .hamb{display:none;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;width:34px;height:34px;font-size:16px}
  .rail-scrim{display:none}
  @media(max-width:900px){
    .app{grid-template-columns:1fr}
    .rail{position:fixed;top:0;left:0;bottom:0;width:230px;z-index:50;transform:translateX(-105%);transition:transform .2s}
    .app.navopen .rail{transform:none;box-shadow:20px 0 50px rgba(0,0,0,.5)}
    .app.navopen .rail-scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:45}
    .hamb{display:grid;place-items:center}
    .content{padding:14px}
    .review-grid{grid-template-columns:1fr}
    /* on mobile, show review pane first (the actionable part) */
    .review-grid .pane:first-child{order:2}
    .review-grid .pane:last-child{order:1}
    .topbar{padding:0 12px;gap:8px}
    .mode-select{max-width:150px}
    .kv{grid-template-columns:104px 1fr auto}
    .line{grid-template-columns:1fr 44px 70px}
    .line .sku{display:none}
    .drawer{width:100vw}
    .stat .t{flex:1;min-width:0}
    /* queue table -> stacked cards */
    .tbl.responsive thead{display:none}
    .tbl.responsive tr{display:block;border:1px solid var(--border);border-radius:10px;margin-bottom:10px;padding:6px 10px;background:var(--surface-1)}
    .tbl.responsive td{display:flex;justify-content:space-between;gap:12px;border:0;padding:6px 2px;text-align:right}
    .tbl.responsive td::before{content:attr(data-lbl);color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px;text-align:left}
    .tbl.responsive tr.grouphdr{background:var(--surface-2);padding:8px 12px}
    .tbl.responsive tr.grouphdr td{display:block;text-align:left}
    .tbl.responsive tr.grouphdr td::before{content:none}
  }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="rail-scrim" id="railScrim"></div>
  <!-- RAIL -->
  <nav class="rail">
    <div class="brand">
      <div class="mark">C</div>
      <div><h1>Chloe</h1><small>your AI bookkeeper</small></div>
    </div>
    <a class="navitem active" data-view="review"><span class="ic">▤</span> Review <span class="badge" id="nav-review">1</span></a>
    <a class="navitem" data-view="queue"><span class="ic">☰</span> Queue <span class="badge" id="nav-queue">5</span></a>
    <a class="navitem" data-view="alerts"><span class="ic">◈</span> Alerts <span class="badge" id="nav-alerts">3</span></a>
    <a class="navitem" data-view="settings"><span class="ic">⚙</span> Settings</a>
    <div class="spacer"></div>
    <div class="rail-foot">
      Prototype · wired to<br><code style="color:#9cc6f5">chloe-private-supplier-bill-v1</code><br>
      Demo data unless Live is on.
    </div>
  </nav>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <button class="hamb" id="hamb" aria-label="Menu">☰</button>
      <span class="title" id="crumb">Review</span>
      <span class="grow"></span>
      <select class="mode-select" id="modeSel">
        <option value="atm_northlakes">atm_northlakes · live</option>
        <option value="atm_beerwah">atm_beerwah · parked</option>
      </select>
      <div class="toggle" id="liveToggle">
        <button data-live="demo" class="on">Demo</button>
        <button data-live="live">Live</button>
      </div>
      <span class="chip" id="sessChip"><span class="dot" style="background:var(--good)"></span> session ok</span>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<!-- DRAWER -->
<div class="drawer-wrap" id="drawerWrap">
  <div class="drawer">
    <div class="dh"><span id="drawerTitle" style="font-weight:600"></span><button class="close" onclick="closeDrawer()">✕</button></div>
    <div class="db" id="drawerBody"></div>
    <div class="df" id="drawerFoot"></div>
  </div>
</div>

<script>
/* ============================================================
   Chloe cockpit — vanilla state-driven prototype
   Mirrors the gateway contract: action + mode -> {state,...}
   ============================================================ */
const STATE = {
  view:'review',
  mode:'atm_northlakes',
  live:false,
  gatewayUrl:'https://mechanicsai.app.n8n.cloud/webhook/chloe-private-supplier-bill-v1',
  ttsUrl:'https://mechanicsai.app.n8n.cloud/webhook/chloe-tts-v1',
  sessionToken:'',
  bill:null,          // current review packet
  answered:{supplier:false, inventory:false},
};

/* ---------- confidence -> status bucket (color + icon + label) ---------- */
function conf(c){
  if(c>=0.90) return {cls:'good', ic:'✓', label:'High', pct:Math.round(c*100)};
  if(c>=0.70) return {cls:'warn', ic:'▲', label:'Review', pct:Math.round(c*100)};
  return {cls:'critical', ic:'!', label:'Uncertain', pct:Math.round(c*100)};
}
function confPill(c){const k=conf(c);return `<span class="pill ${k.cls}"><span class="g">${k.ic}</span>${k.label} · ${k.pct}%</span>`;}

/* ---------- gateway call: demo routes to mocks, live does fetch ---------- */
async function callGateway(action, body={}){
  const payload={action, mode:STATE.mode, session_token:STATE.sessionToken, ...body};
  if(STATE.live){
    const res = await fetch(STATE.gatewayUrl,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',body:JSON.stringify(payload)});
    if(res.status===401) return {success:false,state:'authentication_error',error_code:'private_session_required',message:'A valid private Chloe session and business mode are required.'};
    return res.json();
  }
  // DEMO
  if(STATE.mode==='atm_beerwah'){
    return {success:false,state:'invalid_input',error_code:'tenant_offline',message:'atm_beerwah is parked (tenant_offline). Switch to atm_northlakes.',blockers:['tenant_offline'],next_actions:[]};
  }
  await new Promise(r=>setTimeout(r, action==='process_supplier_bill'?2600:520));
  if(action==='process_supplier_bill'){ STATE.bill=deepClone(MOCK_BILL); STATE.answered={supplier:false,inventory:false}; return STATE.bill; }
  if(action==='list_review_queue') return deepClone(MOCK_QUEUE);
  if(action==='list_notifications') return deepClone(MOCK_NOTES);
  if(action==='confirm_bank_reconciliation') return {success:true,state:'approved',action_id:body.action_id,status:'approved',posts_to_xero:false,message:'Match approved and logged. Finalise the reconciliation in Xero.',match:body._match||{}};
  if(['match_supplier_bill','commit_supplier_bill'].includes(action)) return mockAdvance(action,body);
  return {success:false,state:'invalid_input',error_code:'unknown_action',message:'Unknown action',blockers:[],next_actions:[]};
}

function reviewPane(b){
  const s=b.summary;
  let head=`<div class="pane-head"><span class="t">Review</span>`;
  if(b.state==='review_required') head+=`<span class="pill warn"><span class="g">▲</span> Needs review</span>`;
  if(b.state==='ready_for_confirmation') head+=`<span class="pill accent"><span class="g">◆</span> Ready to confirm</span>`;
  if(b.state==='completed') head+=`<span class="pill good"><span class="g">✓</span> Draft created</span>`;
  head+=`<span class="grow" style="flex:1"></span><button class="btn ghost" onclick="resetBill()" style="padding:5px 10px;font-size:12px">✕ Close</button></div>`;

  if(b.state==='completed') return head+`<div class="pane-body">${completedHTML(b)}</div>`;

  let body=`<div class="pane-body">`;
  // question card (one at a time)
  if(b.targeted_question) body+=questionHTML(b);
  else if(b.state==='ready_for_confirmation') body+=confirmHTML(b);

  // duplicate warning
  if(b.duplicate_candidates && b.duplicate_candidates.length){
    const d=b.duplicate_candidates[0];
    body+=`<div class="block warnband"><div class="h"><span class="pill warn"><span class="g">▲</span> Possible duplicate</span></div>
      <div class="b">Similar to bill <b>${d.bill_number}</b> (${money(d.total)}). ${confPill(d.confidence)}
      <div class="evi">${d.evidence.map(e=>'• '+e).join('<br>')}</div>
      <div class="row" style="margin-top:10px"><button class="btn" onclick="alert('Would open side-by-side compare')">Compare</button><button class="btn ghost" onclick="this.closest('.block').style.opacity=.5">Not a duplicate</button></div></div></div>`;
  }
  // summary block
  body+=`<div class="block"><div class="h">Bill summary</div><div class="b">
    ${kv('Supplier', supplierLine(b))}
    ${kv('Invoice #', s.invoice_number,'invoice_number')}
    ${kv('Issued', s.invoice_date,'invoice_date')}
    ${kv('Due', s.due_date,'due_date')}
    ${kv('Subtotal', money(s.subtotal),'subtotal')}
    ${kv('GST', money(s.tax)+' <span class="muted" style="font-weight:400">→ 1B on BAS</span>','tax')}
    ${kv('Total', '<b>'+money(s.total)+'</b>','total')}
  </div></div>`;

  // line items + inventory + sale links
  body+=`<div class="block"><div class="h">Line items & inventory <span class="grow" style="flex:1"></span><span class="muted" style="font-weight:400;font-size:11.5px">${s.total_line_count} lines</span></div><div class="b">`;
  b.line_items.forEach((l,i)=>{
    const dec=b.inventory_decisions.find(d=>d.line_index===i);
    let tag='';
    if(dec){
      if(dec.selected_match) tag=`<span class="pill good"><span class="g">✓</span> ${dec.selected_match.code}</span>`;
      else tag=`<span class="pill critical"><span class="g">!</span> Needs item</span>`;
    } else tag=`<span class="pill neutral">${l.tax_type.includes('Free')?'GST Free':'Expense'}</span>`;
    body+=`<div class="line"><span class="sku" data-fld="sku${i}">${l.supplier_sku}</span>
      <span class="desc" data-fld="desc${i}">${l.description}</span>
      <span class="r muted">×${l.quantity}</span>
      <span class="r tnum" data-fld="amt${i}">${money(l.line_total)}</span>`;
    // product_sale_link
    const link=(b.product_sale_links||{})[String(i)];
    if(link&&link.length){const s0=link[0];body+=`<div class="linkline">↳ sold on <b>${s0.invoice_number}</b> (${s0.contact_name}) · matched “${s0.matched_description}” ${confPill(s0.confidence)}</div>`;}
    if(tag) body+=`<div style="grid-column:2/-1;margin-top:4px">${tag}</div>`;
    body+=`</div>`;
  });
  body+=`</div></div>`;
  body+=`</div>`;
  return head+body;
}

/* ---------- keyboard-driven review ---------- */
let kFocus=0;
function kbCands(){return Array.from(document.querySelectorAll('#content .cand'));}
function kbInit(){kFocus=0; kbPaint();}
function kbPaint(){const c=kbCands(); c.forEach((el,i)=>el.classList.toggle('kfocus',i===kFocus)); if(c[kFocus]) c[kFocus].scrollIntoView({block:'nearest'});}
function kbMove(d){const c=kbCands(); if(!c.length)return; kFocus=(kFocus+d+c.length)%c.length; kbPaint();}
function kbActivate(){const c=kbCands(); if(c[kFocus]){c[kFocus].click(); return true;} return false;}
function handleReviewKeys(e){
  if(STATE.view!=='review'||!STATE.bill||STATE.bill._processing) return;
  if(/input|textarea|select/i.test(e.target.tagName)) return;
  const b=STATE.bill;
  const k=e.key.toLowerCase();
  if(k==='j'||e.key==='ArrowDown'){e.preventDefault();kbMove(1);}
  else if(k==='k'||e.key==='ArrowUp'){e.preventDefault();kbMove(-1);}
  else if(/^[1-9]$/.test(e.key)){const c=kbCands(); const i=+e.key-1; if(c[i]){kFocus=i;kbPaint();c[i].click();}}
  else if(k==='a'||e.key==='Enter'){
    if(b.state==='ready_for_confirmation'){e.preventDefault();commitBill();}
    else if(b.targeted_question){e.preventDefault();kbActivate();}
  }
  else if(k==='n'&&b.state==='completed'){resetBill();}
}
function highlightDoc(key,on){const t=document.querySelector(`[data-doc="${key}"]`); if(t){t.classList.toggle('hot',on); if(on)t.scrollIntoView({block:'center',behavior:'smooth'});}}

async function startProcess(){

  renderReview();

/* ---------------- QUEUE ---------------- */
let queueData=null, queueFilter='all';
async function renderQueue(){
  const c=el('content');
  c.innerHTML=`<h2 class="page">Review queue</h2><div class="sub">Proposals from <code>bk_proposed_actions</code>, scoped to <b>${STATE.mode}</b>. Reads are display-only — acting still goes through the write actions.</div><div id="qbody" class="muted">Loading…</div>`;
  const r=await callGateway('list_review_queue',{});
  if(r.success===false){el('qbody').innerHTML=errHTML(r);return;}
  queueData=r; paintQueue();
}
const queueSel=new Set();
const APPROVABLE=['awaiting_approval','ready_for_confirmation'];
function approvable(a){return APPROVABLE.includes(a.status);}
function paintQueue(){
  const rows=queueData.actions.filter(a=>queueFilter==='all'||a.status===queueFilter||a.action_type===queueFilter);
  const stat=`<div class="stat">
    <div class="t"><div class="n tnum">${queueData.actions.filter(a=>a.action_type==='supplier_bill').length}</div><div class="l">Supplier bills</div></div>
    <div class="t"><div class="n tnum">${queueData.actions.filter(a=>a.action_type==='bank_reconciliation').length}</div><div class="l">Bank-rec assists</div></div>
    <div class="t"><div class="n tnum" style="color:var(--serious)">${queueData.actions.filter(a=>a.status==='exception').length}</div><div class="l">Exceptions</div></div>
  </div>`;
  const filters=`<div class="filters">
    ${['all','supplier_bill','bank_reconciliation','exception','awaiting_approval','ready_for_confirmation'].map(f=>`<button class="fbtn ${queueFilter===f?'on':''}" onclick="setQF('${f}')">${f.replace(/_/g,' ')}</button>`).join('')}
  </div>`;
  // bulk bar
  let bulk='';
  if(queueSel.size){
    bulk=`<div class="bulkbar"><span class="chk on">✓</span><b>${queueSel.size} selected</b>
      <span class="muted">only approvable rows can be selected</span><span class="grow"></span>
      <button class="btn ghost" onclick="clearSel()">Clear</button>
      <button class="btn good" onclick="bulkApprove()">✓ Approve ${queueSel.size}</button></div>`;
  }
  let grouped={};
  rows.forEach(a=>{(grouped[a.action_type]=grouped[a.action_type]||[]).push(a);});
  const selectableVisible=rows.filter(approvable);
  const allSel=selectableVisible.length&&selectableVisible.every(a=>queueSel.has(a.action_id));
  let body=`<div class="card" style="overflow:hidden"><table class="tbl responsive"><thead><tr>
      <th class="selcol"><span class="chk ${allSel?'on':''}" onclick="toggleAll()">${allSel?'✓':''}</span></th>
      <th>Status</th><th>Supplier / match</th><th>Reason</th><th class="r">Amount</th><th class="r">Age</th></tr></thead><tbody>`;
  Object.keys(grouped).forEach(gt=>{
    body+=`<tr class="grouphdr"><td colspan="6">${gt==='supplier_bill'?'▤ Supplier bills':'⇄ Bank reconciliation'}</td></tr>`;
    grouped[gt].forEach(a=>{
      const amt=a.payload.total||a.payload.txn_total||0;
      const idx=queueData.actions.indexOf(a);
      const sel=queueSel.has(a.action_id);
      const canSel=approvable(a);
      body+=`<tr class="${sel?'selected':''}" onclick="openAction('${a.action_type}',${idx})">
        <td class="selcol" data-lbl="" onclick="event.stopPropagation();${canSel?`toggleSel('${a.action_id}')`:''}">
          ${canSel?`<span class="chk ${sel?'on':''}">${sel?'✓':''}</span>`:'<span class="muted" title="Not bulk-approvable">–</span>'}</td>
        <td data-lbl="Status">${statusPill(a.status)}</td>
        <td data-lbl="Supplier"><b>${a.payload.supplier||a.payload.match_contact||'—'}</b><div class="muted" style="font-size:11.5px">${a.payload.invoice_number||a.payload.match_number||''}</div></td>
        <td class="sec2" data-lbl="Reason">${a.reason}</td>
        <td class="r tnum" data-lbl="Amount">${money(amt)}</td>
        <td class="r" data-lbl="Age"><span class="age" style="color:${a.age_h>24?'var(--serious)':'var(--muted)'}">${a.age_h}h</span></td></tr>`;
    });
  });
  body+=`</tbody></table></div>`;
  el('qbody').innerHTML=stat+filters+bulk+body;
}
function setQF(f){queueFilter=f;paintQueue();}
function toggleSel(id){queueSel.has(id)?queueSel.delete(id):queueSel.add(id);paintQueue();}
function clearSel(){queueSel.clear();paintQueue();}
function toggleAll(){
  const vis=queueData.actions.filter(a=>(queueFilter==='all'||a.status===queueFilter||a.action_type===queueFilter)&&approvable(a));
  const allSel=vis.length&&vis.every(a=>queueSel.has(a.action_id));
  vis.forEach(a=>allSel?queueSel.delete(a.action_id):queueSel.add(a.action_id));
  paintQueue();
}
async function bulkApprove(){
  const ids=[...queueSel];
  const undo=ids.map(id=>{const a=queueData.actions.find(x=>x.action_id===id);return {a,prev:a.status};});
  // fire the right write action per row; bank-rec = confirm_bank_reconciliation (approve-only)
  for(const id of ids){
    const a=queueData.actions.find(x=>x.action_id===id);
    if(a.action_type==='bank_reconciliation'){await callGateway('confirm_bank_reconciliation',{action_id:id,confirmed:true,confirmation_token:'bulk_'+Date.now(),_match:a.payload}); a.status='approved';}
    else {a.status='committed';}
  }
  queueSel.clear(); paintQueue();
  undoToast(`${ids.length} approved`, ()=>{undo.forEach(u=>u.a.status=u.prev);paintQueue();});
}
function undoToast(msg,onUndo){
  const t=document.createElement('div');
  t.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--surface-3);border:1px solid var(--border);padding:10px 16px;border-radius:10px;z-index:60;box-shadow:var(--shadow);display:flex;gap:14px;align-items:center';
  t.innerHTML=`<span>✓ ${msg}</span>`;
  const u=document.createElement('button');u.textContent='Undo';u.className='btn ghost';u.style.padding='4px 10px';
  u.onclick=()=>{onUndo();t.remove();}; t.appendChild(u);
  document.body.appendChild(t); setTimeout(()=>t.remove(),5000);
}
function statusPill(s){
  const map={ready_for_confirmation:['accent','◆'],awaiting_approval:['warn','▲'],exception:['critical','!'],approved:['good','✓'],committed:['good','✓']};
  const m=map[s]||['neutral','•'];
  return `<span class="pill ${m[0]}"><span class="g">${m[1]}</span>${s.replace(/_/g,' ')}</span>`;
}
function openAction(type,i){
  const a=queueData.actions[i];
  openDrawer(type==='bank_reconciliation'?'Bank-rec proposal':'Supplier bill proposal', actionDetail(a), actionFoot(a,type,i));
}
function actionDetail(a){
  const p=a.payload;
  let h=`<div style="margin-bottom:14px">${statusPill(a.status)} <span class="muted" style="margin-left:8px">${a.action_id}</span></div>`;
  h+=`<div class="block"><div class="h">Reason</div><div class="b">${a.reason}<div class="muted" style="margin-top:6px">Expected: ${a.expected_result}</div></div></div>`;
  if(a.action_type==='bank_reconciliation'){
    h+=`<div class="block"><div class="h">Match ${confPill(p.confidence)}</div><div class="b">
      ${kv('Bank txn', p.txn_type+' '+money(p.txn_total)+' · '+p.txn_date)}
      ${kv('Matches', p.match_type+' '+p.match_number)}
      ${kv('Contact', p.match_contact)}
      <div class="evi" style="margin-top:8px">${p.evidence.map(e=>'• '+e).join('<br>')}</div></div></div>
      <div class="banner info"><span>ℹ️</span><div><b>Approve-only.</b> Confirming logs an approval and flips the proposal to <code>approved</code> — it does <b>not</b> post to Xero (<code>posts_to_xero:false</code>). Finalise the reconcile in Xero.</div></div>`;
  } else {
    h+=`<div class="block"><div class="h">Bill</div><div class="b">${kv('Supplier',p.supplier)}${kv('Invoice #',p.invoice_number)}${kv('Total',money(p.total))}</div></div>`;
  }
  return h;
}
function actionFoot(a,type,i){
  if(type==='bank_reconciliation' && a.status!=='approved'){
    return `<button class="btn ghost" onclick="closeDrawer()">Close</button><button class="btn good" onclick="confirmBankRec(${i})">✓ Approve match</button>`;
  }
  if(type==='supplier_bill'){
    return `<button class="btn ghost" onclick="closeDrawer()">Close</button><button class="btn primary" onclick="closeDrawer();setView('review')">Open in review →</button>`;
  }
  return `<button class="btn ghost" onclick="closeDrawer()">Close</button>`;
}
async function confirmBankRec(i){
  const a=queueData.actions[i];
  const r=await callGateway('confirm_bank_reconciliation',{action_id:a.action_id,confirmed:true,confirmation_token:'ok_'+Date.now(),_match:a.payload});
  if(r.success===false) return showError(r);
  a.status='approved';
  el('drawerBody').innerHTML=`<div class="banner ok"><span>✓</span><div><b>${r.message}</b></div></div>`+actionDetail(a);
  el('drawerFoot').innerHTML=`<span class="pill accent">posts_to_xero: false</span><button class="btn" onclick="closeDrawer();paintQueue()">Done</button>`;
}

const Chloe = (function(){
  let fig, bubble, dock, bubbleTimer, muted=false, voices=[];
  function loadVoices(){ try{ voices = speechSynthesis.getVoices()||[]; }catch(e){ voices=[]; } }
  function pickVoice(){
    if(!voices.length) loadVoices();
    const byName = voices.find(v=>/(karen|catherine|samantha|fiona|serena|moira|tessa|veena|libby|sonia|natasha|aria|jenny|female|zira|susan|hazel)/i.test(v.name)&&/^en/i.test(v.lang));
    return byName
      || voices.find(v=>/en-AU/i.test(v.lang))
      || voices.find(v=>/en-GB/i.test(v.lang))
      || voices.find(v=>/^en/i.test(v.lang)) || null;
  }
  function mount(){
    const style=document.createElement('style'); style.textContent=CHLOE_CSS; document.head.appendChild(style);
    dock=document.createElement('div'); dock.id='chloeDock';
    dock.innerHTML=`<div id="chloeBubble"></div>
      <div id="chloeFig" class="chloe-fig idle confident">${CHLOE_SVG}</div>
      <div id="chloeCtrls"><button class="cbtn" id="cMute" title="Mute Chloe's voice">🔊</button><button class="cbtn" id="cMin" title="Hide Chloe">–</button></div>`;
    document.body.appendChild(dock);
    const mini=document.createElement('button'); mini.id='chloeMini'; mini.textContent='C'; mini.title='Show Chloe'; document.body.appendChild(mini);
    fig=dock.querySelector('#chloeFig'); bubble=dock.querySelector('#chloeBubble');
    dock.querySelector('#cMute').onclick=()=>{ muted=!muted; dock.querySelector('#cMute').textContent=muted?'🔇':'🔊'; if(muted&&'speechSynthesis'in window) speechSynthesis.cancel(); };
    dock.querySelector('#cMin').onclick=()=>{ dock.classList.add('min'); };
    mini.onclick=()=>{ dock.classList.remove('min'); };
    fig.onclick=()=>{ if(lastText) say(lastText, lastOpts); };
    if('speechSynthesis'in window){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }
  }
  let lastText='', lastOpts={};
  function setMood(motion, emotion){
    if(!fig) return;
    fig.className='chloe-fig '+(motion||'idle')+' '+(emotion||'confident');
  }
  function talkFor(text){
    if(!fig) return;
    fig.classList.add('talking');
    clearTimeout(bubbleTimer);
    const words=(text.replace(/<[^>]+>/g,' ').match(/\S+/g)||[]).length;
    bubbleTimer=setTimeout(()=>fig.classList.remove('talking'), Math.max(1400, words*300));
  }
  let audioEl=null;
  function speak(text){
    if(muted || !text) return false;
    const clean=text.replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim();
    // Live mode → branded OpenAI voice via the n8n TTS endpoint; fall back to the browser voice.
    if(STATE.live && STATE.ttsUrl){ playTts(clean); return true; }
    return browserSpeak(clean);
  }
  async function playTts(clean){
    try{
      if(audioEl){ try{audioEl.pause();}catch(e){} }
      fig&&fig.classList.add('talking');
      const res=await fetch(STATE.ttsUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:clean})});
      if(!res.ok) throw new Error('tts '+res.status);
      const blob=await res.blob();
      audioEl=new Audio(URL.createObjectURL(blob));
      audioEl.onended=audioEl.onerror=()=>fig&&fig.classList.remove('talking');
      await audioEl.play();
    }catch(e){ browserSpeak(clean); }
  }
  function browserSpeak(clean){
    if(!('speechSynthesis'in window)) return false;
    try{ speechSynthesis.cancel(); }catch(e){}
    const u=new SpeechSynthesisUtterance(clean);
    const v=pickVoice(); if(v){ u.voice=v; u.lang=v.lang; } else u.lang='en-AU';
    u.rate=1.02; u.pitch=1.1;
    u.onstart=()=>fig&&fig.classList.add('talking');
    u.onend=u.onerror=()=>fig&&fig.classList.remove('talking');
    try{ speechSynthesis.speak(u); return true; }catch(e){ return false; }
  }
  function say(text, opts){
    opts=opts||{}; lastText=text; lastOpts=opts;
    if(!fig) return;
    setMood(opts.motion||'gesture', opts.emotion||'confident');
    bubble.innerHTML=text; bubble.classList.add('show');
    clearTimeout(bubble._t); bubble._t=setTimeout(()=>bubble.classList.remove('show'), 7000);
    // alert/gesture are transient poses -> relax to idle after a beat (emotion stays)
    if(opts.motion==='alert') setTimeout(()=>{ if(fig) fig.classList.replace('alert','idle'); }, 1200);
    const spoke=speak(text);
    talkFor(text); // visual mouth even if audio is muted/blocked
  }
  /* Drop-in for the backend contract: pass a chloe-app-v2 response and she reacts. */
  function applyCharacterState(resp){
    if(!resp) return;
    const cs=resp.character_state||resp;
    const motion = cs.animation==='ALERT_EXCLAIM' ? 'alert' : (cs.animation==='GESTURE_RIGHT_PANEL' ? 'gesture' : 'idle');
    const emotion = cs.emotion==='concerned' ? 'concerned' : 'confident';
    const text = (resp.ui_queue && resp.ui_queue.chat_bubble && resp.ui_queue.chat_bubble.text)
      || (cs.chat_bubble && cs.chat_bubble.text) || resp.text;
    if(text!=null && text!=='') say(text,{motion,emotion}); else setMood(motion,emotion);
  }
  return { mount, say, setMood, applyCharacterState };
})();
window.Chloe=Chloe;

/* decide what Chloe says from the current review state (deduped) */
let _chloeKey='';
function chloeReviewReact(){
  if(!window.Chloe || STATE.view!=='review') return;
  const b=STATE.bill; let key,text,motion='gesture',emotion='confident';
  if(STATE.mode==='atm_beerwah'){ key='parked'; text="Beerwah's parked for now — flip to Northlakes and I'll get to work."; motion='idle'; emotion='concerned'; }
  else if(!b){ key='idle'; text="Hi, I'm Chloe. Drop a supplier bill on me and I'll take it from here."; motion='idle'; }
  else if(b._processing){ key='proc'; text="On it — reading your bill now."; motion='idle'; }
  else if(b.state==='review_required' && b.targeted_question){
    key='q:'+b.targeted_question.id;
    text = b.targeted_question.type==='supplier'
      ? "I'm about <b>78%</b> sure this is Burson — can you confirm the right contact?"
      : "Two tracked items look close for the Penrite. Which one should I use?";
    motion='gesture';
  }
  else if(b.state==='ready_for_confirmation'){ key='ready'; text="All matched and coded — I've prepared a draft for <b>"+money(b.summary.total)+"</b>. Approve when you're ready."; motion='gesture'; }
  else if(b.state==='completed'){ key='done'; text="Done — the draft's in Xero. I'll remember Burson and that Penrite SKU next time."; motion='idle'; }
  else return;
  if(key===_chloeKey) return; _chloeKey=key;
  Chloe.say(text,{motion,emotion});
}

Chloe.mount();
setView('review');
</script>
